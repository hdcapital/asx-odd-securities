name: Daily ASX odd securities scan

on:
  schedule:
    # 07:30 UTC Mon-Fri = 6:30pm Sydney in summer (5:30pm in winter), after the close
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write   # lets the job save the daily snapshot back to the repo

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          TZ: Australia/Sydney
        run: python scan.py --email

      - name: Keep the spreadsheet (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: asx-odd-securities-report
          path: output/*.xlsx
          retention-days: 30

      - name: Save snapshot to repo
        run: |
          git config user.name "asx-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.csv data/history option_terms.csv
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Daily scan $(date +%F)"
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
            git push
          fi
